name: Deploy to GitHub Pages

on:
  # Bei jedem Push auf den main-Branch automatisch deployen
  push:
    branches: [main]
  # Erlaubt manuelles Auslösen im Actions-Tab
  workflow_dispatch:

# Benötigte Rechte für das Deployment auf GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # Falls Astro als Projektseite (username.github.io/repo) laeuft,
        # hier den Basispfad setzen, z.B.:
        # with:
        #   path: .
        #   node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
